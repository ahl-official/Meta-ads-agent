version: '3.8'

services:
  meta-ads-agent:
    build: .
    container_name: meta-ads-agent
    restart: always
    ports:
      - "8020:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
